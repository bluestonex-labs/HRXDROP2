#~~~ Services needed ~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~
# Shown where a page needs an endpoint the HRX service does not have yet.
# The full list is in README.md, "Services still needed".

serviceNeededPolicies=<strong>Service needed: policies and acknowledgements.</strong> The HRX service has no endpoint for policy documents yet, so there is nothing to read or acknowledge. Needed: Policies, PolicyAcknowledgements, fetchMyPolicies() and acknowledgePolicy(PolicyID).
serviceNeededDocuments=<strong>Service needed: policies and acknowledgements.</strong> Documents cannot be published or tracked until the HRX service can store them. Needed: Policies and PolicyAcknowledgements (the file kept in SAP Document Management), fetchPolicyAcknowledgements(PolicyID), and sendReminder for Remind outstanding.
serviceNeededSickness=<strong>Service needed: sickness follow-up.</strong> Absences and policy triggers are real, but follow-up messages, dismissals and return-to-work checklists cannot be saved until the HRX service has SicknessReviews and ReturnToWork.
serviceNeededClientTeam=<strong>Service needed: ClientUsers.</strong> The HRX service has no client support users yet. This tab still reads and saves them through the original org-apps service, which knows clients by its own keys, so it may be empty for clients held in HRX.
serviceNeededClientSla=<strong>Service needed: ClientSLAs.</strong> The HRX service has no service levels yet. This tab still reads and saves them through the original org-apps service, which knows clients by its own keys, so it may be empty for clients held in HRX.
serviceNeededClientComponents=<strong>Service needed: ClientComponents.</strong> The HRX service has no licensed components yet. This tab still reads and saves them through the original org-apps service, which knows clients by its own keys, so it may be empty for clients held in HRX.
serviceNeededClientApps=<strong>Service needed: ClientApplications.</strong> The HRX service has no application services yet. This tab still reads and saves them through the original org-apps service, which knows clients by its own keys, so it may be empty for clients held in HRX.
serviceNeededProjectAreas=<strong>Service needed: ProjectAreas.</strong> Project areas are not held by the HRX service. They still come from the original org-apps service, and are hidden where it has none.
serviceNeededProjectTeam=<strong>Service needed: ProjectClientTeam.</strong> The HRX service has no client team for a project yet (it also needs ClientUsers). This tab still uses the original org-apps service.
serviceNeededProjectAttachments=<strong>Service needed: project attachments.</strong> The HRX service cannot store files against a project yet: it needs Documents to accept object type Project, and fetchProjectDocuments(ProjectID). This tab still uses the original org-apps service.

