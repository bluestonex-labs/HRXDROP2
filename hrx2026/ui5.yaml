# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: bsx.hrx.hrx2026
type: application
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: false # If set to true, certificate errors will be ignored. E.g. self-signed certificates will be accepted
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /services
            url: https://bsx-tdd-tdd-bsx-org-apps-services-v2.cfapps.eu10.hana.ondemand.com
            # destination: bsxorgappsservices
            # Left out on purpose for local runs: fiori-tools-proxy sends the
            # request to https://bsxorgappsservices.dest, which answers 502 here,
            # while url: above reaches the service directly. The destination name
            # still applies once deployed - xs-app.json carries it.
          - path: /hrx
            url: http://localhost:4004
            destination: hrxservices
            # The HRX service. In Business Application Studio the proxy uses the
            # destination (url is ignored there), which signs the request in as the
            # user. Anywhere else the destination is ignored and the url is used:
            # the deployed service answers only a signed-in user, so a local preview
            # talks to a local copy of it (cds watch on port 4004 - see README).
          - path: /browser
            url: https://api-sdm-di.cfapps.eu10.hana.ondemand.com
            destination: dms_service
            # Profile pictures and client logos (SAP Document Management). In BAS
            # through the dms_service destination; elsewhere they need a sign-in the
            # local preview does not have, and the pages show initials instead.
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
