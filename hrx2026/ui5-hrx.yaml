# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json
# Local preview without a CAP project (npm run start-hrx).
# /hrx is answered by mock/ (a local package - see mock/ui5.yaml): with HRX_TOKEN set (a
# bearer token for the deployed HRX service) requests are proxied to it; otherwise an
# in-memory stand-in with the service's own entities, functions and actions answers.
# /services (the original org-apps services) is called directly, as in ui5.yaml.
specVersion: "4.0"
metadata:
  name: bsx.hrx.hrx2026
type: application
server:
  customMiddleware:
    - name: hrx-service
      afterMiddleware: compression
      configuration:
        mountPath: /hrx
        serviceUrl: https://bsx-tdd-tdd-bsx-hrx-srv.cfapps.eu10.hana.ondemand.com
    - name: fiori-tools-proxy
      afterMiddleware: hrx-service
      configuration:
        ignoreCertErrors: false
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /services
            url: https://bsx-tdd-tdd-bsx-org-apps-services-v2.cfapps.eu10.hana.ondemand.com
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
